# eBPF Mesh agent configuration (example).
# Install as /etc/ebpf-mesh/agent.toml and adapt to the host. Nothing in the
# code assumes these values; every site-specific setting lives here.

# bpffs directory holding per-interface pins (<pin_root>/<iface>/...).
pin_root = "/sys/fs/bpf/ebpf-mesh"

# Compiled XDP object (built by `make`, installed by the operator).
bpf_obj = "/usr/lib/ebpf-mesh/em_xdp.bpf.o"

# One block per interface the agent manages. Use the PoP's internet-facing
# NIC. "native" (driver) mode is the production mode; "generic" exists for
# NICs without native XDP and for tests.
[[interface]]
name     = "eth1"
xdp_mode = "native"
