# Sentinel-Edge control-plane API (example). Secrets come from the
# environment variables named below, never from this file.

[server]
listen = "127.0.0.1:8080"
public_url = "https://portal.example.org"
cookie_secure = true          # only false for plain-HTTP labs
trust_proxy = false           # true behind a reverse proxy that sets X-Forwarded-For

[database]
url_env = "SENTINEL_DATABASE_URL"              # role sentinel_api
owner_url_env = "SENTINEL_DATABASE_OWNER_URL"  # owner role, for `sentinel-api migrate`
max_connections = 10

[anycast]
prefix4 = "198.51.100.0/24"   # protected IPs are allocated from here
tunnel_ep4 = "198.51.100.1"   # never allocated (ADR 0012)
reserved4 = []
pop_mtu = 1500

[rules]
min_prefix_v4 = 16            # customers cannot allow/block wider than /16
min_prefix_v6 = 32
max_per_tenant = 1000
max_block_ttl_days = 30

[sessions]
absolute_hours = 12
idle_minutes = 60

[auth]
login_max_failures = 5        # per account per window
login_ip_max_failures = 30    # per client IP per window
window_minutes = 15
min_password_len = 12
data_key_env = "SENTINEL_DATA_KEY"   # base64 of 32 random bytes

[mail]
mode = "log"                  # "file" (labs, tests) or "log"; SMTP later
from = "noreply@example.org"

[nats]
url = "tls://nats.mgmt.example.org:4222"
ca = "/etc/sentinel/nats-ca.pem"
nkey_seed_file = "/etc/sentinel/api.nk"
