# The "transit provider" of the Ansible test: offers a default route and
# shows what the PoP announces.
router id 172.30.78.2;
protocol device {}
protocol static defaultroute { ipv4; route 0.0.0.0/0 blackhole; }
protocol bgp pop {
  local 172.30.78.2 as 64501;
  neighbor 172.30.78.10 as 65010;
  hold time 9;
  keepalive time 3;
  ipv4 { import all; export where proto = "defaultroute"; };
}
