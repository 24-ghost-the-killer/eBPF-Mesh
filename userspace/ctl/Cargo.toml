[package]
name = "meshctl"
description = "eBPF Mesh dataplane control: attach/detach the XDP program and read its counters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
em-common.workspace = true

# The BPF loader is Linux-only. On other hosts the binary builds (so
# `cargo test --workspace` works on a laptop) but refuses to run.
[target.'cfg(target_os = "linux")'.dependencies]
libbpf-rs.workspace = true
libc.workspace = true

