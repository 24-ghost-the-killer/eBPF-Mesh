[workspace]
resolver = "3"
members = [
    "userspace/common",
    "userspace/ctl",
    "userspace/agent",
    "userspace/worker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/24-ghost-the-killer/eBPF-Mesh"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
libbpf-rs = "0.27"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
em-common = { path = "userspace/common" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
