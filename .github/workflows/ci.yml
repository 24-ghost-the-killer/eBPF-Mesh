# SPDX-License-Identifier: MIT OR Apache-2.0
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      lab:
        description: "Also run the containerlab anycast lab (about 10 minutes)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/pw-browsers
    steps:
      - uses: actions/checkout@v7

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libbpf-dev libelf-dev zlib1g-dev pkg-config \
            iproute2 iputils-ping jq curl ethtool openssl python3 postgresql ansible-core

      - name: Install NATS server and CLI (pinned, checksummed)
        run: sudo deploy/docker/install-nats.sh

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Install Node.js and pnpm (pinned, checksummed)
        run: sudo deploy/docker/install-node.sh

      - name: Lint and unit tests
        run: make test

      - name: API integration tests (throwaway PostgreSQL)
        run: make test-api

      - name: Build XDP object and workspace
        run: make build

      - name: BPF tests (BPF_PROG_TEST_RUN)
        run: sudo make test-bpf

      - name: Integration tests (veth + netns, native XDP)
        run: sudo make test-integration

      - name: Web app (API client drift, typecheck, Vitest, build)
        run: make test-web

      - name: Chromium and its system libraries
        run: sudo env "PATH=$PATH" PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Browser tests against the lab (Playwright)
        run: sudo env "PATH=$PATH" PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH E2E_ARTIFACTS=$PWD/build/e2e-artifacts make test-e2e

      - name: Deployment - Ansible syntax and the PoP playbook against a stand-in server
        run: |
          make deploy-check
          make deploy-artifacts
          make deploy-test

      - name: Free disk space for the image builds
        run: |
          df -h /
          rm -rf target build/e2e-artifacts
          docker system prune -af >/dev/null
          df -h /

      - name: Deployment - control-plane stack from scratch (docker compose)
        run: make deploy-smoke

      - name: Keep browser traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: build/e2e-artifacts
          if-no-files-found: ignore

  anycast-lab:
    # Started by hand (Actions -> ci -> Run workflow, "lab" ticked).
    if: github.event_name == 'workflow_dispatch' && inputs.lab
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the test image
        run: make docker-image
      - name: Anycast lab acceptance (containerlab on the runner's Docker)
        run: make lab-test
      - name: Keep lab logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lab-logs
          path: lab/state/logs
          if-no-files-found: ignore
