global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: ["/etc/prometheus/alerts.yml"]
scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: caddy
    static_configs: [{ targets: ["caddy:2019"] }]
  # PoP agents (metrics_listen on their management address; the PoP
  # firewall only lets the Prometheus network in). One entry per PoP:
  # [{"targets": ["192.0.2.11:9466"], "labels": {"pop": "ams1"}}]
  - job_name: sentinel-agent
    file_sd_configs: [{ files: ["/etc/prometheus/targets/pops.json"], refresh_interval: 1m }]
