# Example inventory (documentation addresses only). Copy to
# inventories/<site>/ (git-ignored) and fill in your real values.
all:
  children:
    pops:
      hosts:
        pop-ams1:
          ansible_host: 192.0.2.11          # management address
          pop_id: ams1
          pop_region: eu-west
          pop_uplink_iface: eth1
          pop_ip4: 192.0.2.11               # unicast address on the uplink
          bgp_router_id: 192.0.2.11
          bgp_upstreams:
            - name: transit1
              neighbor: 192.0.2.1
              asn: 64501
              max_prefix: 10                # import limit (we only want a default route)
