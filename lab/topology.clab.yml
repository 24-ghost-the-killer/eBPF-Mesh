# SPDX-License-Identifier: MIT OR Apache-2.0
# Sentinel-Edge anycast lab (spec 11.5, ADR 0023). Lab address plan only:
# documentation and private ranges, private ASNs.
#
#   region-1..3   BIRD "internet" routers, AS 65001-65003, full mesh
#   pop-1..3      BIRD (AS 65010) + XDP + sentinel-agent + health check
#   origin-1      customer server behind region-1 (192.0.2.10)
#   client-1..3   legitimate visitors, bot-1..3 traffic generators
#   nats, postgres, clickhouse, api, worker-1, worker-2: management network
#
# Data links (eth0 is always management):
#   region-N eth1 <-> pop-N eth1        10.10.N.0/24   (.1 region, .2 PoP)
#   region-1 eth2 <-> region-2 eth2     10.1.12.0/30
#   region-1 eth3 <-> region-3 eth2     10.1.13.0/30
#   region-2 eth3 <-> region-3 eth3     10.1.23.0/30
#   region-N eth4 <-> client-N eth1     203.0.113.(32N)/28
#   region-N eth5 <-> bot-N eth1        203.0.113.(32N+16)/28
#   region-1 eth6 <-> origin-1 eth1     192.0.2.0/24
#
# Run with `make lab-up` / `make lab-test` (lab/scripts/lab.sh); the state
# directory (secrets, generated configs, logs) is created by setup.sh.
name: sentinel

mgmt:
  network: sentinel-mgmt
  ipv4-subnet: 172.31.250.0/24

topology:
  defaults:
    kind: linux
    image: sentinel-lab:latest
    binds:
      - ../build/lab:/opt/sentinel:ro
      - bird:/lab/bird:ro
      - scripts:/lab/scripts:ro
      - state:/lab/state
  nodes:
    nats:       {mgmt-ipv4: 172.31.250.10, exec: ["sh /lab/scripts/node.sh nats"]}
    postgres:   {mgmt-ipv4: 172.31.250.11, exec: ["sh /lab/scripts/node.sh postgres"]}
    clickhouse:
      kind: linux
      image: clickhouse/clickhouse-server:25.8.33.6
      mgmt-ipv4: 172.31.250.12
      binds:
        - ../migrations/clickhouse:/migrations:ro
      env-files:
        - state/clickhouse.env
    api:        {mgmt-ipv4: 172.31.250.13, exec: ["sh /lab/scripts/node.sh api"]}
    worker-1:   {mgmt-ipv4: 172.31.250.21, exec: ["sh /lab/scripts/node.sh worker 1"]}
    worker-2:   {mgmt-ipv4: 172.31.250.22, exec: ["sh /lab/scripts/node.sh worker 2"]}
    region-1:   {mgmt-ipv4: 172.31.250.31, exec: ["sh /lab/scripts/node.sh region 1"]}
    region-2:   {mgmt-ipv4: 172.31.250.32, exec: ["sh /lab/scripts/node.sh region 2"]}
    region-3:   {mgmt-ipv4: 172.31.250.33, exec: ["sh /lab/scripts/node.sh region 3"]}
    pop-1:      {mgmt-ipv4: 172.31.250.41, exec: ["sh /lab/scripts/node.sh pop 1"]}
    pop-2:      {mgmt-ipv4: 172.31.250.42, exec: ["sh /lab/scripts/node.sh pop 2"]}
    pop-3:      {mgmt-ipv4: 172.31.250.43, exec: ["sh /lab/scripts/node.sh pop 3"]}
    origin-1:   {mgmt-ipv4: 172.31.250.51, exec: ["sh /lab/scripts/node.sh origin 1"]}
    client-1:   {mgmt-ipv4: 172.31.250.61, exec: ["sh /lab/scripts/node.sh client 1"]}
    client-2:   {mgmt-ipv4: 172.31.250.62, exec: ["sh /lab/scripts/node.sh client 2"]}
    client-3:   {mgmt-ipv4: 172.31.250.63, exec: ["sh /lab/scripts/node.sh client 3"]}
    bot-1:      {mgmt-ipv4: 172.31.250.71, exec: ["sh /lab/scripts/node.sh bot 1"]}
    bot-2:      {mgmt-ipv4: 172.31.250.72, exec: ["sh /lab/scripts/node.sh bot 2"]}
    bot-3:      {mgmt-ipv4: 172.31.250.73, exec: ["sh /lab/scripts/node.sh bot 3"]}
  # MTU 1500 on every link: veth XDP refuses containerlab's default 9500.
  links:
    - endpoints: ["region-1:eth1", "pop-1:eth1"]
      mtu: 1500
    - endpoints: ["region-2:eth1", "pop-2:eth1"]
      mtu: 1500
    - endpoints: ["region-3:eth1", "pop-3:eth1"]
      mtu: 1500
    - endpoints: ["region-1:eth2", "region-2:eth2"]
      mtu: 1500
    - endpoints: ["region-1:eth3", "region-3:eth2"]
      mtu: 1500
    - endpoints: ["region-2:eth3", "region-3:eth3"]
      mtu: 1500
    - endpoints: ["region-1:eth4", "client-1:eth1"]
      mtu: 1500
    - endpoints: ["region-2:eth4", "client-2:eth1"]
      mtu: 1500
    - endpoints: ["region-3:eth4", "client-3:eth1"]
      mtu: 1500
    - endpoints: ["region-1:eth5", "bot-1:eth1"]
      mtu: 1500
    - endpoints: ["region-2:eth5", "bot-2:eth1"]
      mtu: 1500
    - endpoints: ["region-3:eth5", "bot-3:eth1"]
      mtu: 1500
    - endpoints: ["region-1:eth6", "origin-1:eth1"]
      mtu: 1500
