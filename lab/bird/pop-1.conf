# pop-1 (AS 65010): announces the anycast prefix to region-1 (spec 11.2).
include "/etc/bird/drain.conf";     # define DRAIN = 0|1; written by sentinel-agent
router id 10.10.1.2;
log stderr all;

protocol device {}

# Routes learned from the region go to the kernel (origins, clients, other
# PoPs' unicast addresses); the anycast blackhole stays inside BIRD: XDP
# handles those packets before the kernel.
protocol kernel {
  ipv4 { import none; export where source = RTS_BGP; };
}

protocol static anycast4 {
  ipv4;
  route 198.51.100.0/24 blackhole;
}

filter export_anycast {
  if proto = "anycast4" then {
    if DRAIN = 1 then { bgp_path.prepend(65010); bgp_path.prepend(65010); }
    accept;
  }
  reject;
}

protocol bgp upstream4 {
  local 10.10.1.2 as 65010;
  neighbor 10.10.1.1 as 65001;
  direct;
  hold time 3;
  keepalive time 1;
  connect retry time 2;
  ipv4 { import all; export filter export_anycast; };
}
