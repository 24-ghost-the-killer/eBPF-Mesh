# region-2 (AS 65002): an "internet" router. Peers with pop-2 and the other
# regions, announces its client, bot (and origin) networks.
router id 10.10.2.1;
log stderr all;

protocol device {}
protocol direct { ipv4; interface "eth1", "eth2", "eth3", "eth4", "eth5", "eth6"; }

protocol kernel {
  ipv4 { import none; export where source = RTS_BGP; };
}

template bgp peer {
  local as 65002;
  direct;
  hold time 3;
  keepalive time 1;
  connect retry time 2;
  ipv4 { import all; export all; };
}

protocol bgp pop from peer { neighbor 10.10.2.2 as 65010; }
protocol bgp region1 from peer { neighbor 10.1.12.1 as 65001; }
protocol bgp region3 from peer { neighbor 10.1.23.2 as 65003; }
